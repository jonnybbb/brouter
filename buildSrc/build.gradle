plugins {
    id 'groovy-gradle-plugin'
}

repositories {
    gradlePluginPortal()
    mavenCentral()
}

dependencies {
    // Animal Sniffer lets the library convention plugin enforce that shipped
    // bytecode stays within the Android API 23 surface (minSdkVersion 23).
    implementation 'ru.vyarus:gradle-animalsniffer-plugin:2.0.1'
}
