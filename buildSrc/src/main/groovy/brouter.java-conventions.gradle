plugins {
    id 'java'
    id 'checkstyle'
    id 'pmd'
    id 'brouter.version-conventions'
}

group = 'org.btools'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}

compileJava {
    options.release = 11
}

test {
    // Fast unit + bundled-fixture tests only. The slow real-segment suites moved
    // to brouter-core's src/integrationTest (run via `./gradlew integrationTest`),
    // so the loop.tests/golden.tests/via.measure opt-in flags and the 8g heap that
    // used to live here now belong to that task.
    systemProperty 'greedy.diagnostic', System.getProperty('greedy.diagnostic', 'false')
}

pmd {
    consoleOutput = true
    toolVersion = '7.0.0'
    rulesMinimumPriority = 5
    ruleSetFiles = files("${rootProject.rootDir}/config/pmd/pmd-ruleset.xml")
    ruleSets = []
    // ignoreFailures = true
}
